name: Gerar AAB para Google Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Código de versão maior que o último enviado à Play Console
        type: string
        required: true
      version_name:
        description: Versão exibida aos usuários (ex. 1.0.1)
        type: string
        required: true

permissions:
  contents: read

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Validar versão
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || (( VERSION_CODE > 2100000000 )); then
            echo '::error::Informe um código de versão inteiro entre 1 e 2100000000.'
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ [^[:space:]] ]]; then
            echo '::error::Informe a versão que será exibida aos usuários.'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar dependências e testar
        run: |
          npm ci
          npm test

      - name: Compilar o app e sincronizar o Capacitor
        run: npm run android:sync

      - name: Gerar Android App Bundle
        working-directory: android
        run: |
          bash ./gradlew --no-daemon :app:bundleRelease \
            "-PlistaJuntoVersionCode=$VERSION_CODE" "-PlistaJuntoVersionName=$VERSION_NAME"

      - name: Assinar o bundle com a chave de upload
        id: sign
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
              ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Configure o secret $secret nas configurações do repositório."
              exit 1
            fi
          done

          keystore=$(mktemp "$RUNNER_TEMP/lista-junto-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset ANDROID_UPLOAD_KEYSTORE_BASE64

          bundle="$RUNNER_TEMP/lista-junto-${VERSION_CODE}-r${GITHUB_RUN_ATTEMPT}.aab"
          jarsigner -keystore "$keystore" \
            -storepass:env ANDROID_UPLOAD_STORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEY_PASSWORD \
            -signedjar "$bundle" android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Disponibilizar o AAB para download
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.sign.outputs.bundle }}
          archive: false
          if-no-files-found: error
          retention-days: 14
