<form (submit)="$event.preventDefault(); submit()">
  <mat-form-field appearance="outline">
    <mat-label>{{ t('Confirme o preço por unidade ({currency})', { currency: currency() }) }}</mat-label>
    <input matInput id="price-result" [ljDecimal]="2" type="text" inputmode="decimal" [formControl]="price()" required>
    <mat-error>{{ t('Informe um preço válido.') }}</mat-error>
  </mat-form-field>
  <button mat-flat-button type="submit">{{ t('Usar este preço') }}</button>
</form>
