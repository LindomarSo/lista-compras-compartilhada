<form (submit)="$event.preventDefault(); submit()">
  <mat-form-field appearance="outline">
    <mat-label>Confirme o preço por unidade</mat-label>
    <input matInput id="price-result" type="number" inputmode="decimal" min="0" max="100000000" step="0.01" [formControl]="price()" required>
    <mat-error>Informe um preço válido.</mat-error>
  </mat-form-field>
  <button mat-flat-button type="submit">Usar este preço</button>
</form>
