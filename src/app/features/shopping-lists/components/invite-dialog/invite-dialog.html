<h2 mat-dialog-title>Convidar para a lista</h2>
<mat-dialog-content>
  <p>Quem tiver o link pode adicionar e marcar itens.</p>
  <div class="actions">
    @if (canShare) { <button mat-flat-button type="button" (click)="send()">Compartilhar convite</button> }
    <button mat-stroked-button type="button" (click)="copy()">Copiar link</button>
  </div>
  @if (manual()) { <label for="invite-link">Link da lista</label><input id="invite-link" readonly [value]="data.url"> }
  @if (feedback()) { <p class="notice" role="status">{{ feedback() }}</p> }
</mat-dialog-content>
<mat-dialog-actions><button mat-button mat-dialog-close type="button">Fechar</button></mat-dialog-actions>
