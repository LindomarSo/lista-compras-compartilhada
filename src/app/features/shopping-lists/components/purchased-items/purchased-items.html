@if (items().length) {
  <mat-expansion-panel class="purchased-panel" expanded>
    <mat-expansion-panel-header><mat-panel-title>Comprados <span class="count">{{ items().length }}</span></mat-panel-title></mat-expansion-panel-header>
    <lj-item-rows [items]="items()" [disabled]="disabled()" (toggled)="toggled.emit($event)" (edited)="edited.emit($event)" (removed)="removed.emit($event)" />
  </mat-expansion-panel>
}
