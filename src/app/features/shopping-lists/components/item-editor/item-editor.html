<form [id]="idPrefix() + '-form'" [formGroup]="form" (ngSubmit)="submit()">
  <div class="composer">
    <label [for]="idPrefix() + '-name'">Nome do produto <span aria-hidden="true">*</span></label>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <input [id]="idPrefix() + '-name'" matInput formControlName="name" placeholder="Ex.: Arroz, Leite, Café…" maxlength="120" autocomplete="off" required>
    </mat-form-field>
  </div>
  <button mat-button class="details-toggle" [id]="idPrefix() + '-details'" type="button" [attr.aria-expanded]="details()" [attr.aria-controls]="idPrefix() + '-fields'" (click)="details.set(!details())">
    <span class="details-label">
      <svg lucideTag class="lj-icon" aria-hidden="true"></svg>
      Detalhes do item
      <svg lucideChevronDown class="lj-icon details-chevron" aria-hidden="true"></svg>
    </span>
  </button>
  <div class="details" [id]="idPrefix() + '-fields'" [hidden]="!details()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Quantidade</mat-label><input matInput [id]="idPrefix() + '-quantity'" type="number" step="any" formControlName="quantity" required>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Unidade</mat-label><mat-select formControlName="unit">
        @for (unit of units; track unit) { <mat-option [value]="unit">{{ unit }}</mat-option> }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Preço por unidade</mat-label><input matInput #priceInput [id]="idPrefix() + '-price'" type="number" step="0.01" inputmode="decimal" formControlName="estimated_price">
    </mat-form-field>
    @if (supportsCategory()) {
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Categoria</mat-label><mat-select [id]="idPrefix() + '-category'" formControlName="category">
          <mat-option value="">Automática ({{ suggested() }})</mat-option>
          @for (option of options; track option[0]) { <mat-option [value]="option[0]">{{ option[1] }}</mat-option> }
        </mat-select>
      </mat-form-field>
    }
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="wide">
      <mat-label>Observações</mat-label><input matInput formControlName="notes" maxlength="500">
    </mat-form-field>
    <button mat-stroked-button #readPriceButton [id]="editing() ? 'read-edited-item-price' : 'read-price'" class="wide" type="button" [disabled]="disabled() || openingReader()" (click)="readPrice()">Ler preço da etiqueta</button>
  </div>
  @if (feedback()) { <p class="notice" role="status">{{ feedback() }}</p> }
</form>
