<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
    <mat-label>Nome da lista</mat-label>
    <input id="list-name" matInput formControlName="name" [maxlength]="maxLength"
      placeholder="Ex.: Compras da semana" autocomplete="off" required>
  </mat-form-field>
  @if (error()) { <p class="notice error" role="alert">{{ error() }}</p> }
  <div class="form-actions">
    <button id="create-button" mat-flat-button type="submit" [disabled]="name.invalid || !name.value.trim()">Criar lista</button>
  </div>
</form>
